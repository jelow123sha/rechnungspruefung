<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnungsprüfung</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <header>
        <h1>Rechnungsprüfung</h1>
        <nav>
            <button id="tab-open" class="tab active">Offene Rechnungen</button>
            <button id="tab-history" class="tab">Historische Freigaben</button>
        </nav>
        <span id="status"></span>
    </header>

    <main id="main-area">
        <section id="pane-left" class="pane-left">
            <div class="pane-list">
                <table id="invoice-table">
                    <thead>
                        <tr>
                            <th>Datei</th>
                            <th>Rechnungssteller</th>
                            <th>Empfänger</th>
                            <th>Brutto</th>
                            <th>Eingang</th>
                        </tr>
                    </thead>
                    <tbody id="invoice-body"></tbody>
                </table>

                <table id="history-table" class="hidden">
                    <thead>
                        <tr>
                            <th>Datei</th>
                            <th>Rechnungssteller</th>
                            <th>Empfänger</th>
                            <th>Brutto</th>
                            <th>Eingang</th>
                            <th>Freigegeben am</th>
                            <th>Prüfer</th>
                            <th>Kommentar</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>

            <div id="approval-panel" class="approval-panel hidden">
                <h2 id="approval-title">Freigabe</h2>
                <label for="approver">Prüfer (Pflichtfeld):</label>
                <input id="approver" type="text" placeholder="Ihr Name" autocomplete="name">
                <label for="comment">Kommentar:</label>
                <textarea id="comment" rows="4" placeholder="Anmerkung zur Rechnung (optional, wird in die PDF geschrieben)"></textarea>
                <label for="stamp-position">Position des Freigabe-Vermerks in der PDF:</label>
                <select id="stamp-position">
                    <option value="bottom-left">Unten links</option>
                    <option value="bottom-right">Unten rechts</option>
                    <option value="top-left">Oben links</option>
                    <option value="top-right">Oben rechts</option>
                    <option value="last-page">Eigene Seite am Ende (verdeckt nichts)</option>
                </select>
                <div class="actions">
                    <button id="btn-save-comment" class="secondary">Kommentar speichern</button>
                    <button id="btn-approve" class="primary">Freigeben &amp; archivieren</button>
                </div>
                <div id="merge-box" class="merge-box">
                    <label for="merge-select">PDF an diese Rechnung anhängen (zusammenfügen):</label>
                    <select id="merge-select"></select>
                    <div class="actions">
                        <button id="btn-merge" class="secondary">Zusammenfügen</button>
                    </div>
                </div>
                <p id="approval-msg" class="msg"></p>
            </div>
        </section>

        <div id="divider" title="Ziehen, um die Breite anzupassen"></div>

        <section id="pane-view" class="pane-view">
            <div id="viewer-empty" class="viewer-empty">
                <p>Rechnung aus der Liste auswählen, um sie hier anzuzeigen.</p>
            </div>
            <iframe id="pdf-view" class="hidden" title="Rechnungsvorschau"></iframe>
        </section>
    </main>

    <script src="app.js?v=4"></script>
</body>
</html>
